# Render Blueprint — the API and the worker as two services off one package.
#
# They share server/package.json and differ only in start command: the API
# listens, the worker polls. Separate services because a web service is killed
# or slept when it stops serving requests, which is exactly what a poll loop
# does between messages.
#
# The client stays on Vercel; it is not described here.
#
# Secrets are declared with sync: false, so Render prompts for them on first
# deploy instead of this file holding them.

services:
  - type: web
    name: expense-tracker-api
    runtime: node
    rootDir: server
    plan: starter
    buildCommand: npm ci && npx prisma generate
    startCommand: npm start
    # Touches nothing, so a database blip doesn't cause a restart loop.
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # The API enqueues; both services talk to the same queue.
      - key: SQS_QUEUE_URL
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

  - type: worker
    name: expense-tracker-worker
    runtime: node
    rootDir: server
    plan: starter
    buildCommand: npm ci && npx prisma generate
    startCommand: npm run worker
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SQS_QUEUE_URL
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # No CLERK_SECRET_KEY: the worker never serves a request and has no
      # session to verify — it takes the user id from the queue message.
