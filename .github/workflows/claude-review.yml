# Reviews a pull request automatically when it opens.
#
# Deliberately NOT on `synchronize`. That fires on every push to an open PR, so
# a branch pushed six times is six full reviews of largely the same diff — noisy
# to read and billed each time. Opening and un-drafting are the moments a review
# is actually wanted; `@claude review this again` (see claude.yml) covers the
# rest on demand.

name: Claude Review

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  review:
    # A draft PR is work in progress by definition.
    if: github.event.pull_request.draft == false

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          # See claude.yml: subscription auth via `claude setup-token`, so
          # these reviews bill to the plan and not to API credits.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Repo-specific on purpose. A generic reviewer re-derives style
          # opinions this project already settled in CLAUDE.md and DESIGN.md;
          # what it cannot know without being told is which invariants here are
          # load-bearing. Those are listed first because they are where a bug
          # is silent rather than loud.
          prompt: |
            Review this pull request against the conventions in CLAUDE.md and
            the architecture in DESIGN.md, both of which are in the repository.

            Weight these highest, in order:

            1. Every database query must be scoped by user_id. An unscoped
               query that happens to be safe today because its inputs are
               server-generated is still a finding — say so, and say what
               would have to change for it to become exploitable.
            2. Idempotency. Imports are keyed by (user_id, idempotency_key)
               and transactions by (import_id, row_index). Any new write path
               touching those tables needs the same guarantee, because the SQS
               visibility timeout guarantees batches are replayed.
            3. Worker error handling. A swallowed error in the worker is a
               batch stuck in PENDING with no signal. Deleting an SQS message
               before its work commits trades a duplicate for a permanent loss.
               A per-row failure must never throw out of a batch handler.
            4. Correctness bugs generally: resource leaks, stale closures in
               React effects, unhandled rejections, off-by-one in batching.

            Before reporting anything that depends on how a third-party library
            behaves, verify it against that library's actual source or docs
            rather than from memory. Previous automated reviews on this repo
            were confidently wrong about the `ws` library's API twice, and a
            wrong finding costs more to disprove than a missed one costs to
            catch later.

            Skip formatting and naming; ESLint and Prettier own those. Skip
            praise. If the diff is clean, say so briefly rather than
            manufacturing findings.

            For each finding give the file and line, the concrete failure
            scenario (inputs or interleaving that trigger it), and your
            confidence. Order by severity.
